<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markdown Renderer</title>
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Marked KaTeX extension -->
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

    <!-- Prism for syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>

    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.6.1/github-markdown.min.css">

    <style>
        body {
            background-color: transparent;
            margin: 0;
            padding: 16px;
            overflow-x: hidden;
            width: 100vw;
            box-sizing: border-box;
        }

        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 100%;
            margin: 0 auto;
            background-color: transparent;
        }

        /* LaTeX specific styles - matching web service logic */
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 12px 0;
            margin: 1em 0;
            display: block;
            -webkit-overflow-scrolling: touch;
        }

        /* Ensure tags (labels) stay at the far right and don't overlap */
        .katex-display > .katex {
            display: inline-block;
            white-space: nowrap;
            min-width: 100%;
            text-align: center;
        }

        /* Prevent overlap and ensure formulas take full width if needed */
        .katex {
            text-rendering: auto;
            font-variant-numeric: normal;
        }

        /* Tables horizontal scroll */
        .markdown-body table {
            display: block;
            width: 100%;
            overflow: auto;
        }
    </style>
</head>
<body class="markdown-body">
    <div id="content"></div>

    <script>
        const contentDiv = document.getElementById('content');
        let currentSessionId = '';

        function resolveImageSource(source, baseUrl) {
            if (!source || /^(?:https?:|data:|blob:|#)/i.test(source)) return source;
            if (!baseUrl) return source;

            // Remove leading ./ if present
            const assetPath = source.replace(/^\.\//, '');

            // Construct full URL
            // baseUrl is expected to be something like: https://server/api/papers/{id}/assets
            let fullUrl = baseUrl.endsWith('/') ? baseUrl + assetPath : baseUrl + '/' + assetPath;

            // Append token for authentication if available
            if (currentSessionId) {
                fullUrl += (fullUrl.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(currentSessionId);
            }

            return fullUrl;
        }

        function updateContent(markdown, baseUrl, sessionId) {
            currentSessionId = sessionId || '';
            const renderer = new marked.Renderer();

            renderer.image = ({ href, title, text }) => {
                const src = resolveImageSource(href, baseUrl);
                console.log('Rendering image:', { original: href, resolved: src });
                let out = `<img src="${src}" alt="${text || ''}"`;
                if (title) {
                    out += ` title="${title}"`;
                }
                out += ' onerror="this.style.display=\'none\'; console.error(\'Failed to load image:\', this.src)">';
                return out;
            };

            const options = {
                renderer,
                gfm: true,
                breaks: true
            };

            // Use the KaTeX extension for robust math rendering
            marked.use(markedKatex({
                throwOnError: false,
                output: 'html',
                nonStandard: true // Supports $...$ for inline math
            }));

            contentDiv.innerHTML = marked.parse(markdown, options);

            // Highlight code blocks
            Prism.highlightAllUnder(contentDiv);

            if (window.Android) {
                window.Android.onRenderComplete(document.body.scrollHeight);
            }
        }

        // Listen for messages from the Android app
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data && data.type === 'update') {
                updateContent(data.markdown, data.baseUrl, data.sessionId);
            }
        });

        // Handle touch events to prevent page-level horizontal shifting
        document.body.addEventListener('touchstart', function(e) {
            let target = e.target;
            while (target && target !== document.body) {
                const style = window.getComputedStyle(target);
                if (style.overflowX === 'auto' || style.overflowX === 'scroll') {
                    return;
                }
                target = target.parentElement;
            }
        }, { passive: true });
    </script>
</body>
</html>
